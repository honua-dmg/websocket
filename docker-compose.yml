services:
  websocket:
    build: .
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATA_ROOT: ${DATA_ROOT:-/data}
      PORT: ${PORT:-8765}
    ports:
      - "8765:8765"
    volumes:
      - ${DATA_HOST_PATH:-../retreival_kite/data/data}:/data
    restart: unless-stopped
    networks:
      - retreival_kite_app-network

networks:
  retreival_kite_app-network:
    external: true
